name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Release]
        
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
  
    - name: Build main
      run: cd JaebeMusicStudio3.Front; dotnet publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Zip
        path: JaebeMusicStudio3.Front\bin\Release\net9.0-windows\publish

    - name: Generate ZIP
      run: rm JaebeMusicStudio3.Installer\Files.zip; Compress-Archive JaebeMusicStudio3.Front\bin\Release\net9.0-windows\publish\* JaebeMusicStudio3.Installer\Files.zip

    - name: Build installer
      run: cd JaebeMusicStudio3.Installer; dotnet publish -p:PublishSingleFile=true
      
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Installer
        path: JaebeMusicStudio3.Installer\bin\Release\net10.0-windows\win-x64\publish\JaebeMusicStudio3.Installer.exe

    - name: Test
      uses: actions/upload-artifact@v4
      with:
        name: test
        path: .
